<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital PiggyBank</title>

    <link rel="preconnect"
    href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunit0:wght@500;600;700&family
    =Nunito+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <main class="dashboard">
        <header class="dashboard-header">
            <div class="greeting">
                <h1>Good morning!</h1>
                <p>Let's make today a saving day</p>
            </div>

        </header>

        <section class="savings-overview">
            <div class="savings-card">
                <p class="card-label">Total Saved</p>
                <h2>0.00</h2>
                <p class="card-note">Keep building</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    
</body>
</html>
